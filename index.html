<!DOCTYPE html>
<html>
<head>
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <h1>REGISTRO DE USUARIOS</h1>

    <label>Nombre:</label>
    <input type="text" id="nombre">
    <br><br>

    <label>Apellido Paterno:</label>
    <input type="text" id="apellidoPaterno">
    <br><br>

    <label>Apellido Materno:</label>
    <input type="text" id="apellidoMaterno">
    <br><br>

    <label>Teléfono:</label>
    <input type="text" id="telefono">
    <br><br>

    <label>Dirección:</label>
    <input type="text" id="direccion">
    <br><br>

    <label>Correo Electrónico:</label>
    <input type="email" id="correo">
    <br><br>

    <button onclick="enviar()">Enviar</button>

    <h2>DATOS DEL USUARIO</h2>

    <p id="resultadoNombre"></p>
    <p id="resultadoApellidoPaterno"></p>
    <p id="resultadoApellidoMaterno"></p>
    <p id="resultadoTelefono"></p>
    <p id="resultadoDireccion"></p>
    <p id="resultadoCorreo"></p>

    <script src="script.js"></script>

</body>
</html>
